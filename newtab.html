<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/newtab.css">
</head>
<body>
  <!-- 背景中心暖调柔光晕 (Ambient Glow) -->
  <div class="ambient-glow-wrapper" id="ambientGlow"></div>

  <!-- 右下角主题与个性化设置按钮 -->
  <button class="corner-btn bottom-right-btn" id="themeToggleBtn" title="个性化与主题外观" aria-label="主题设置">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
      <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
      <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
      <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C22 6.5 17.5 2 12 2z"></path>
    </svg>
  </button>

  <!-- 视口核心主容器 -->
  <main class="main-viewport">
    <!-- 居中几何流光 Logo -->
    <div class="brand-hero">
      <svg class="brand-symbol" id="brandFlower" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="brandGrad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="var(--flower-stop-1, #ff9f43)" id="flowerStop1a" />
            <stop offset="50%" stop-color="var(--flower-stop-2, #ff792e)" id="flowerStop1b" />
            <stop offset="100%" stop-color="var(--flower-stop-3, #ff521d)" id="flowerStop1c" />
          </linearGradient>
          <linearGradient id="brandGrad2" x1="85" y1="15" x2="15" y2="85" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="var(--flower-stop-1, #ffa852)" id="flowerStop2a" />
            <stop offset="100%" stop-color="var(--flower-stop-3, #f54e1b)" id="flowerStop2b" />
          </linearGradient>
          <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="var(--accent-color, #ff6e26)" flood-opacity="0.3" id="flowerDropShadow" />
          </filter>
        </defs>
        <!-- 4瓣几何交叉圆角条条 -->
        <g filter="url(#subtleShadow)">
          <rect x="22" y="38" width="56" height="24" rx="12" transform="rotate(-45 50 50)" fill="url(#brandGrad)" />
          <rect x="22" y="38" width="56" height="24" rx="12" transform="rotate(45 50 50)" fill="url(#brandGrad2)" />
          <circle cx="50" cy="50" r="10" fill="#ffffff" fill-opacity="0.25" />
        </g>
      </svg>
    </div>

    <!-- 居中全能输入与提示卡片 -->
    <div class="omnibar-card-container">
      <div class="omnibar-card" id="omnibarCard">
        <!-- 上层输入区 -->
        <div class="omnibar-input-row">
          <input
            id="mainInput"
            class="omnibar-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索输入框"
            placeholder="搜索网页、打开站点，或输入 / 查看快捷命令…"
          >
        </div>

        <!-- 下层快捷操作工具条 -->
        <div class="omnibar-action-toolbar">
          <div class="toolbar-left">
            <!-- Bento 常用应用网格 -->
            <button class="tool-icon-btn" id="bentoBtn" title="常用捷径与应用" aria-label="应用捷径">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                <rect x="3" y="14" width="7" height="7" rx="2"></rect>
              </svg>
            </button>
          </div>

          <div class="toolbar-right">
            <!-- 搜索引擎切换胶囊 -->
            <button class="engine-selector-chip" id="engineSelectorChip" title="选择默认搜索引擎">
              <span id="engineChipName">Default</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>

            <!-- 发送/搜索箭头按钮 -->
            <button class="send-action-btn" id="sendActionBtn" title="搜索或执行" aria-label="执行搜索">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>
      <div class="popover-card slash-palette-popover hidden" id="slashPalette">
        <div class="palette-header">
          <span>快捷指令</span>
          <span style="font-size: 11px; font-weight: normal;">支持 ↑ ↓ 键切换</span>
        </div>
        <ul class="palette-list" id="paletteList"></ul>
      </div>

      <!-- 搜索建议与历史记录浮层 (Search Suggestions & History Popover) -->
      <div class="popover-card search-suggestions-popover hidden" id="searchSuggestionsPopover">
        <div class="suggestions-header" id="suggestionsHeader">
          <span id="suggestionsHeaderTitle">搜索建议与历史</span>
          <span style="font-size: 11px; font-weight: normal;">支持 ↑ ↓ 键切换</span>
        </div>
        <ul class="suggestions-list" id="suggestionsList"></ul>
      </div>

      <!-- 搜索引擎切换下拉菜单 (Engine Menu Popover) -->
      <div class="popover-card engine-menu-popover hidden" id="engineMenu">
        <div class="engine-option" data-engine="google">
          <div class="engine-option-left">
            <span class="engine-option-icon">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
              </svg>
            </span>
            <span>Google</span>
          </div>
        </div>
        <div class="engine-option" data-engine="bing">
          <div class="engine-option-left">
            <span class="engine-option-icon">
              <svg width="18" height="18" viewBox="0 0 24 24">
                <path fill="#00839B" d="M5 3v16.5l5 2.5 8-4.5v-5l-6.5 2.3V7.2L5 3z"/>
                <path fill="#00B4D8" d="M11.5 7.2l6.5 3.6-3.2 1.9-3.3-1.7V7.2z"/>
              </svg>
            </span>
            <span>微软必应</span>
          </div>
        </div>
        <div class="engine-option" data-engine="baidu">
          <div class="engine-option-left">
            <span class="engine-option-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="#2932E1">
                <path d="M9.154 0C7.71 0 6.54 1.658 6.54 3.707c0 2.051 1.171 3.71 2.615 3.71 1.446 0 2.614-1.659 2.614-3.71C11.768 1.658 10.6 0 9.154 0zm7.025.594C14.86.58 13.347 2.589 13.2 3.927c-.187 1.745.25 3.487 2.179 3.735 1.933.25 3.175-1.806 3.422-3.364.252-1.555-.995-3.364-2.362-3.674a1.218 1.218 0 0 0-.261-.03zM3.582 5.535a2.811 2.811 0 0 0-.156.008c-2.118.19-2.428 3.24-2.428 3.24-.287 1.41.686 4.425 3.297 3.864 2.617-.561 2.262-3.68 2.183-4.362-.125-1.018-1.292-2.773-2.896-2.75zm16.534 1.753c-2.308 0-2.617 2.119-2.617 3.616 0 1.43.121 3.425 2.988 3.362 2.867-.063 2.553-3.238 2.553-3.988 0-.745-.62-2.99-2.924-2.99zm-8.264 2.478c-1.424.014-2.708.925-3.323 1.947-1.118 1.868-2.863 3.05-3.112 3.363-.25.309-3.61 2.116-2.864 5.42.746 3.301 3.365 3.237 3.365 3.237s1.93.19 4.171-.31c2.24-.495 4.17.123 4.17.123s5.233 1.748 6.665-1.616c1.43-3.364-.808-5.109-.808-5.109s-2.99-2.306-4.736-4.798c-1.072-1.665-2.348-2.268-3.528-2.257zm-2.234 3.84l1.542.024v8.197H7.758c-1.47-.291-2.055-1.292-2.13-1.462-.072-.173-.488-.976-.268-2.343.635-2.049 2.447-2.196 2.447-2.196h1.81zm3.964 2.39v3.881c.096.413.612.488.612.488h1.614v-4.343h1.689v5.782h-3.915c-1.517-.39-1.59-1.465-1.59-1.465v-4.317zm-5.458 1.147c-.66.197-.978.708-1.05.928-.076.22-.247.78-.1 1.269.294 1.095 1.248 1.144 1.248 1.144h1.37v-3.34z"/>
              </svg>
            </span>
            <span>百度</span>
          </div>
        </div>
        <div class="engine-option" data-engine="github">
          <div class="engine-option-left">
            <span class="engine-option-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
              </svg>
            </span>
            <span>GitHub</span>
          </div>
        </div>
      </div>

      <!-- Bento 自定义常用捷径面板 (Bento Popover) -->
      <div class="popover-card bento-popover hidden" id="bentoMenu">
        <div class="bento-header">
          <span class="bento-title">常用捷径与站点</span>
          <button class="bento-add-btn" id="bentoAddToggleBtn" title="添加常用站点">+ 添加</button>
        </div>

        <!-- 添加表单区域 -->
        <div class="bento-add-form hidden" id="bentoAddForm">
          <input type="text" id="shortcutNameInput" class="bento-form-input" placeholder="站点名称" autocomplete="off" />
          <input type="text" id="shortcutUrlInput" class="bento-form-input" placeholder="网址" autocomplete="off" />
          <div class="bento-form-actions">
            <button type="button" class="bento-btn-secondary" id="bentoCancelBtn">取消</button>
            <button type="button" class="bento-btn-primary" id="bentoSaveBtn">保存</button>
          </div>
        </div>

        <!-- 常用站点动态网格（默认为空） -->
        <div class="bento-grid" id="bentoGrid"></div>
      </div>
    </div>
  </main>




  <!-- 右下角主题设置面板 (Theme Settings Popover) -->
  <div class="theme-settings-popover hidden" id="themeSettings">
    <div>
      <div class="settings-group-title">预设经典配色</div>
      <div class="color-palette-options">
        <div class="color-dot active" data-color="#ff6e26" style="background: #ff6e26;" title="晨曦暖橙 (经典原版)"></div>
        <div class="color-dot" data-color="#8b5cf6" style="background: #8b5cf6;" title="极光幽紫"></div>
        <div class="color-dot" data-color="#10b981" style="background: #10b981;" title="翠微青竹"></div>
        <div class="color-dot" data-color="#3b82f6" style="background: #3b82f6;" title="澄澈海蓝"></div>
        <div class="color-dot" data-color="#f43f5e" style="background: #f43f5e;" title="霞彩玫瑰"></div>
      </div>
    </div>

    <!-- 专属大圆角无极调色板模块 -->
    <div class="custom-color-section">
      <div class="custom-color-header">
        <div class="settings-group-title" style="margin-bottom: 0;">无极调色板</div>
        <span class="custom-color-hex" id="customColorHexTag">#FF6E26</span>
      </div>

      <div class="custom-picker-container" id="customPickerContainer">
        <!-- 2D 饱和度/明度大圆角拾色板 -->
        <div class="picker-sv-box" id="pickerSvBox">
          <div class="picker-sv-white"></div>
          <div class="picker-sv-black"></div>
          <div class="picker-sv-cursor" id="pickerSvCursor"></div>
        </div>

        <!-- 中间控制条：吸管 + 颜色预览 + 1D 色相胶囊滑条 -->
        <div class="picker-controls-row">
          <button class="picker-eyedropper-btn" id="pickerEyedropperBtn" title="屏幕拾色吸管" aria-label="屏幕拾色">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2c.8.8 2 .8 2.8 0L19 11Z"/>
              <path d="m5 2 5 5"/>
              <path d="m2 13 3 3"/>
            </svg>
          </button>
          <div class="picker-color-preview" id="pickerColorPreview" style="background: #ff6e26;"></div>
          <div class="picker-hue-slider" id="pickerHueSlider" title="滑动调节色相">
            <div class="picker-hue-thumb" id="pickerHueThumb"></div>
          </div>
        </div>

        <!-- HEX 文本输入微调框 -->
        <div class="picker-hex-input-row">
          <span class="picker-hex-symbol">HEX</span>
          <input type="text" id="customHexInput" class="picker-hex-input" maxlength="7" spellcheck="false" value="#FF6E26">
        </div>
      </div>
    </div>

    <div class="settings-switch-row">
      <span>搜索联想与历史记录</span>
      <input type="checkbox" id="searchSuggestionsSwitch" checked style="cursor: pointer; transform: scale(1.15);">
    </div>

    <div class="settings-switch-row">
      <span>暗黑深色模式</span>
      <input type="checkbox" id="darkModeSwitch" style="cursor: pointer; transform: scale(1.15);">
    </div>
  </div>

  <!-- 脚本载入 -->
  <script src="js/storage.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
