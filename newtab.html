<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新标签页</title>
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/newtab.css">
</head>
<body>
  <!-- 背景中心暖调柔光晕 (Ambient Glow) -->
  <div class="ambient-glow-wrapper" id="ambientGlow"></div>

  <!-- 右下角主题与个性化设置按钮 -->
  <button class="corner-btn bottom-right-btn" id="themeToggleBtn" title="个性化与主题外观" aria-label="主题设置">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="13.5" cy="6.5" r=".5" fill="currentColor"></circle>
      <circle cx="17.5" cy="10.5" r=".5" fill="currentColor"></circle>
      <circle cx="8.5" cy="7.5" r=".5" fill="currentColor"></circle>
      <circle cx="6.5" cy="12.5" r=".5" fill="currentColor"></circle>
      <path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.563-2.512 5.563-5.563C22 6.5 17.5 2 12 2z"></path>
    </svg>
  </button>

  <!-- 视口核心主容器 -->
  <main class="main-viewport">
    <!-- 居中几何流光 Logo -->
    <div class="brand-hero">
      <svg class="brand-symbol" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="brandGrad" x1="15" y1="15" x2="85" y2="85" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ff9f43" />
            <stop offset="50%" stop-color="#ff792e" />
            <stop offset="100%" stop-color="#ff521d" />
          </linearGradient>
          <linearGradient id="brandGrad2" x1="85" y1="15" x2="15" y2="85" gradientUnits="userSpaceOnUse">
            <stop offset="0%" stop-color="#ffa852" />
            <stop offset="100%" stop-color="#f54e1b" />
          </linearGradient>
          <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
            <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#ff6e26" flood-opacity="0.3" />
          </filter>
        </defs>
        <!-- 4瓣几何交叉圆角条条 -->
        <g filter="url(#subtleShadow)">
          <rect x="22" y="38" width="56" height="24" rx="12" transform="rotate(-45 50 50)" fill="url(#brandGrad)" />
          <rect x="22" y="38" width="56" height="24" rx="12" transform="rotate(45 50 50)" fill="url(#brandGrad2)" />
          <circle cx="50" cy="50" r="10" fill="#ffffff" fill-opacity="0.2" />
        </g>
      </svg>
    </div>

    <!-- 居中全能输入与提示卡片 -->
    <div class="omnibar-card-container">
      <div class="omnibar-card" id="omnibarCard">
        <!-- 上层输入区 -->
        <div class="omnibar-input-row">
          <input
            id="mainInput"
            class="omnibar-input"
            type="text"
            autocomplete="off"
            spellcheck="false"
            aria-label="搜索输入框"
            placeholder="搜索网页、打开站点，或输入 / 查看快捷命令…"
          >
        </div>

        <!-- 下层快捷操作工具条 -->
        <div class="omnibar-action-toolbar">
          <div class="toolbar-left">
            <!-- Bento 常用应用网格 -->
            <button class="tool-icon-btn" id="bentoBtn" title="常用捷径与应用" aria-label="应用捷径">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="3" width="7" height="7" rx="2"></rect>
                <rect x="14" y="14" width="7" height="7" rx="2"></rect>
                <rect x="3" y="14" width="7" height="7" rx="2"></rect>
              </svg>
            </button>
          </div>

          <div class="toolbar-right">
            <!-- 搜索引擎/模型选择胶囊 -->
            <button class="engine-selector-chip" id="engineSelectorChip" title="选择默认搜索引擎或大模型">
              <span class="engine-icon">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="4" y="4" width="16" height="16" rx="2"></rect>
                  <rect x="9" y="9" width="6" height="6"></rect>
                  <line x1="9" y1="1" x2="9" y2="4"></line>
                  <line x1="15" y1="1" x2="15" y2="4"></line>
                  <line x1="9" y1="20" x2="9" y2="23"></line>
                  <line x1="15" y1="20" x2="15" y2="23"></line>
                  <line x1="20" y1="9" x2="23" y2="9"></line>
                  <line x1="20" y1="14" x2="23" y2="14"></line>
                  <line x1="1" y1="9" x2="4" y2="9"></line>
                  <line x1="1" y1="14" x2="4" y2="14"></line>
                </svg>
              </span>
              <span id="engineChipName">Default</span>
              <svg class="dropdown-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="6 9 12 15 18 9"></polyline>
              </svg>
            </button>

            <!-- 发送/搜索箭头按钮 -->
            <button class="send-action-btn" id="sendActionBtn" title="搜索或执行" aria-label="执行搜索">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="19" x2="12" y2="5"></line>
                <polyline points="5 12 12 5 19 12"></polyline>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <!-- 斜杠妙招下拉弹出卡片 (Slash Palette Popover) -->
      <div class="popover-card slash-palette-popover hidden" id="slashPalette">
        <div class="palette-header">
          <span>快捷妙招指令</span>
          <span style="font-size: 11px; font-weight: normal;">支持 ↑ ↓ 键切换</span>
        </div>
        <ul class="palette-list" id="paletteList"></ul>
      </div>

      <!-- 搜索引擎切换下拉菜单 (Engine Menu Popover) -->
      <div class="popover-card engine-menu-popover hidden" id="engineMenu">
        <div class="engine-option" data-engine="google">
          <div class="engine-option-left">
            <span class="engine-option-icon">🔍</span>
            <span>Google</span>
          </div>
        </div>
        <div class="engine-option" data-engine="baidu">
          <div class="engine-option-left">
            <span class="engine-option-icon">🐾</span>
            <span>百度</span>
          </div>
        </div>
        <div class="engine-option" data-engine="bing">
          <div class="engine-option-left">
            <span class="engine-option-icon">🌐</span>
            <span>微软必应</span>
          </div>
        </div>
        <div class="engine-option" data-engine="deepseek">
          <div class="engine-option-left">
            <span class="engine-option-icon">⚡</span>
            <span>DeepSeek AI</span>
          </div>
        </div>
        <div class="engine-option" data-engine="chatgpt">
          <div class="engine-option-left">
            <span class="engine-option-icon">🤖</span>
            <span>ChatGPT</span>
          </div>
        </div>
        <div class="engine-option" data-engine="github">
          <div class="engine-option-left">
            <span class="engine-option-icon">🐙</span>
            <span>GitHub</span>
          </div>
        </div>
      </div>

      <!-- Bento 快捷应用九宫格卡片 (Bento Popover) -->
      <div class="popover-card bento-popover hidden" id="bentoMenu">
        <div class="bento-header">
          <span class="bento-title">常用捷径与站点</span>
          <span style="font-size: 11px; color: var(--text-tertiary);">点击直达</span>
        </div>
        <div class="bento-grid">
          <a href="https://github.com" class="bento-app-item" target="_blank">
            <div class="bento-app-icon">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
            </div>
            <span class="bento-app-name">GitHub</span>
          </a>
          <a href="https://bilibili.com" class="bento-app-item" target="_blank">
            <div class="bento-app-icon" style="color: #00aeec;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M17.813 4.653h.854c1.51 0 2.769.84 3.154 2.052.05.158.079.33.079.51v10.367c0 1.62-1.464 2.934-3.233 2.934H5.333C3.564 20.516 2.1 19.202 2.1 17.582V7.215c0-.18.029-.352.079-.51.385-1.212 1.644-2.052 3.154-2.052h.854L4.35 2.815a.8.8 0 0 1 1.13-1.13l2.84 2.84h7.36l2.84-2.84a.8.8 0 1 1 1.13 1.13l-1.837 1.838zM6.9 10.38c-.773 0-1.4.672-1.4 1.5 0 .828.627 1.5 1.4 1.5.773 0 1.4-.672 1.4-1.5 0-.828-.627-1.5-1.4-1.5zm10.2 0c-.773 0-1.4.672-1.4 1.5 0 .828.627 1.5 1.4 1.5.773 0 1.4-.672 1.4-1.5 0-.828-.627-1.5-1.4-1.5z"/></svg>
            </div>
            <span class="bento-app-name">哔哩哔哩</span>
          </a>
          <a href="https://chat.deepseek.com" class="bento-app-item" target="_blank">
            <div class="bento-app-icon" style="color: #0066ff;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v4m0 12v4M4.93 4.93l2.83 2.83m8.48 8.48 2.83 2.83M2 12h4m12 0h4M4.93 19.07l2.83-2.83m8.48-8.48 2.83-2.83"/></svg>
            </div>
            <span class="bento-app-name">DeepSeek</span>
          </a>
          <a href="https://youtube.com" class="bento-app-item" target="_blank">
            <div class="bento-app-icon" style="color: #ff0000;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M23.498 6.186a3.016 3.016 0 0 0-2.122-2.136C19.505 3.545 12 3.545 12 3.545s-7.505 0-9.377.505A3.017 3.017 0 0 0 .502 6.186C0 8.07 0 12 0 12s0 3.93.502 5.814a3.016 3.016 0 0 0 2.122 2.136c1.871.505 9.376.505 9.376.505s7.505 0 9.377-.505a3.015 3.015 0 0 0 2.122-2.136C24 15.93 24 12 24 12s0-3.93-.502-5.814zM9.545 15.568V8.432L15.818 12l-6.273 3.568z"/></svg>
            </div>
            <span class="bento-app-name">YouTube</span>
          </a>
          <a href="https://zhihu.com" class="bento-app-item" target="_blank">
            <div class="bento-app-icon" style="color: #0084ff;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M5.72 4.4v2.09c1.47.05 2.92.17 4.35.35l.43-1.88C8.89 4.67 7.3 4.47 5.72 4.4zm.01 4.14v3.54h3.76V8.92c-1.25-.13-2.51-.26-3.76-.38zm-1.89 7.37H2v2.09h1.84c.64 1.77 1.63 3.32 2.95 4.6l1.62-1.33c-.98-.98-1.74-2.17-2.27-3.48h4.63v-1.88H3.84zm7.62-3.83h2.62c.31-1.39.46-2.82.46-4.28 0-.32-.01-.64-.02-.95H11.5v-2.09h5.18c-.1-1.07-.35-2.09-.73-3.04l2.12-.7c.54 1.25.9 2.6 1.05 4.02h3.38v2.09h-3.45c0 .32.01.63.01.95 0 1.83-.2 3.61-.59 5.31h2.7v2.09h-3.32c-.93 2.82-2.52 5.25-4.63 7.15l-1.52-1.44c1.86-1.63 3.23-3.73 4.01-6.13h-4.24v-2.02z"/></svg>
            </div>
            <span class="bento-app-name">知乎</span>
          </a>
          <a href="https://v2ex.com" class="bento-app-item" target="_blank">
            <div class="bento-app-icon" style="color: #333;">
              <span style="font-weight: 800; font-size: 15px;">V2</span>
            </div>
            <span class="bento-app-name">V2EX</span>
          </a>
          <a href="https://juejin.cn" class="bento-app-item" target="_blank">
            <div class="bento-app-icon" style="color: #1e80ff;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="m12 14.316 4.397-3.52-1.353-1.084L12 12.148l-3.044-2.436-1.353 1.084L12 14.316zm0-7.394 1.722-1.378L12 4.167 10.278 5.544 12 6.922zm0 10.965 7.072-5.658 1.353 1.083L12 19.97l-8.425-6.66 1.353-1.083L12 17.887z"/></svg>
            </div>
            <span class="bento-app-name">稀土掘金</span>
          </a>
          <a href="https://google.com" class="bento-app-item" target="_blank">
            <div class="bento-app-icon" style="color: #4285f4;">
              <span style="font-weight: 800; font-size: 18px;">G</span>
            </div>
            <span class="bento-app-name">Google</span>
          </a>
        </div>
      </div>
    </div>
  </main>


  <!-- 左侧抽屉 Backdrop -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>

  <!-- 左侧滑动抽屉 (Sidebar Drawer) -->
  <aside class="sidebar-drawer" id="sidebarDrawer" aria-label="侧边栏工具">
    <div class="drawer-header">
      <div class="drawer-title">快捷工具
      </div>
      <button class="drawer-close-btn" id="drawerCloseBtn" aria-label="关闭侧边栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </div>
    <div class="drawer-tabs">
      <button class="drawer-tab-btn active" data-tab="bookmarks">书签</button>
      <button class="drawer-tab-btn" data-tab="history">历史记录</button>
      <button class="drawer-tab-btn" data-tab="memo">随手记</button>
    </div>
    <div class="drawer-content">
      <!-- 书签面板 -->
      <div id="tabPane-bookmarks" class="drawer-tab-pane">
        <div id="drawerBookmarksList"></div>
      </div>
      <!-- 历史记录面板 -->
      <div id="tabPane-history" class="drawer-tab-pane hidden">
        <div id="drawerHistoryList"></div>
      </div>
      <!-- 随手记备忘面板 -->
      <div id="tabPane-memo" class="drawer-tab-pane hidden">
        <p style="font-size: 12px; color: var(--text-tertiary); margin-bottom: 8px;">本地自动保存，随时记录闪现灵感与待办事项：</p>
        <textarea id="memoTextarea" class="memo-textarea" placeholder="在此处快速输入内容..."></textarea>
      </div>
    </div>
  </aside>

  <!-- 右下角主题设置面板 (Theme Settings Popover) -->
  <div class="theme-settings-popover hidden" id="themeSettings">
    <div>
      <div class="settings-group-title">主题光晕配色</div>
      <div class="color-palette-options">
        <div class="color-dot active" data-color="orange" style="background: #ff6e26;" title="晨曦暖橙 (经典原版)"></div>
        <div class="color-dot" data-color="purple" style="background: #8b5cf6;" title="极光幽紫"></div>
        <div class="color-dot" data-color="emerald" style="background: #10b981;" title="翠微青竹"></div>
        <div class="color-dot" data-color="blue" style="background: #3b82f6;" title="澄澈海蓝"></div>
        <div class="color-dot" data-color="rose" style="background: #f43f5e;" title="霞彩玫瑰"></div>
      </div>
    </div>

    <div class="settings-switch-row">
      <span>暗黑深色模式</span>
      <input type="checkbox" id="darkModeSwitch" style="cursor: pointer; transform: scale(1.15);">
    </div>

    </div>
  </div>

  <!-- 脚本载入 -->
  <script src="js/storage.js"></script>
  <script src="js/commands.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/newtab.js"></script>
</body>
</html>
